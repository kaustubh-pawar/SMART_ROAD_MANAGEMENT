# Nixpacks configuration for Railway deployment
# Ensures OpenGL and GLib system libraries are present for OpenCV and Ultralytics YOLO

[phases.setup]
aptPkgs = [
  "...",
  "libgl1",
  "libglib2.0-0",
  "libgomp1",
  "ffmpeg"
]

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT server:app --workers 1 --threads 4 --timeout 120"
